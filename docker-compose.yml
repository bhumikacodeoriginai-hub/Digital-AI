services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codeorigin
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: learning_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  postgres_data:
